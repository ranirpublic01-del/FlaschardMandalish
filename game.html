<!DOCTYPE html>
<html lang="id" data-mode="night" data-accent="vermilion">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨打 · Game Mengetik Hanzi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Ma+Shan+Zheng&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<!-- Tema sama dengan situs: warna siang/malam + aksen dibaca dari css/styles.css -->
<link rel="stylesheet" href="css/styles.css">
<style>
#zg{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;font-family:var(--font-ui,Manrope,system-ui,sans-serif);
  --zb:var(--bg-0,#100f14);--zs:var(--surface,#1f1e29);--zf:var(--ink,#efe9da);--zm:var(--ink-soft,#a29c8c);--za:var(--accent,#b23a2e);
  background:var(--zb);color:var(--zf)}
#zg *{box-sizing:border-box}
#zg-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:2px solid var(--za);flex-wrap:wrap}
#zg-bar a,#zg-bar button.zg-ic{color:var(--zf);text-decoration:none;font:700 14px var(--font-ui,Manrope,sans-serif);background:none;border:1.5px solid var(--zm);border-radius:999px;padding:6px 14px;cursor:pointer}
#zg-bar b{flex:1;text-align:center;font:900 20px var(--font-display,'Noto Serif SC',serif);letter-spacing:.08em;white-space:nowrap}
#zg-dots{display:flex;gap:8px}
#zg-bar #zg-dots button{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid transparent;cursor:pointer}
#zg-bar #zg-dots button.on{border-color:var(--zf)}
#zg-stage{flex:1;position:relative;min-height:0}
#cv{display:block;width:100%;height:100%}
.zg-panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  background:color-mix(in srgb,var(--zb) 88%,transparent);padding:20px;overflow:auto}
.zg-panel.hide{display:none}
.zg-big{font:400 clamp(70px,14vw,150px)/1 var(--font-brush,'Ma Shan Zheng'),'Noto Serif SC',serif;color:var(--za)}
.zg-panel h2{margin:0;font:900 26px var(--font-display,'Noto Serif SC',serif)}
.zg-panel p{margin:0;color:var(--zm);font-size:14px;max-width:540px;line-height:1.6}
.zg-panel p b{color:var(--zf)}
.zg-panel select,.zg-btn{font:700 16px var(--font-ui,Manrope,sans-serif);padding:12px 22px;border-radius:12px;border:2px solid var(--zm);background:var(--zs);color:var(--zf);min-width:min(320px,88vw);max-width:92vw}
.zg-btn{background:var(--za);border-color:var(--za);color:#fff;cursor:pointer;box-shadow:4px 4px 0 color-mix(in srgb,var(--za) 40%,#000)}
.zg-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 color-mix(in srgb,var(--za) 40%,#000)}
.zg-btn.ghost{background:none;color:var(--zf);border-color:var(--zm);box-shadow:none}
.zg-stats{display:grid;grid-template-columns:repeat(3,auto);gap:10px 28px;font:700 18px var(--font-ui,Manrope,sans-serif)}
.zg-stats span{display:block;color:var(--zm);font-size:12px;font-weight:600}
.zg-warn{color:var(--za)}
kbd{border:1.5px solid var(--zm);border-radius:6px;padding:1px 7px;font-size:12px}
#zg :focus-visible{outline:2px solid var(--zf);outline-offset:2px}
@media (max-width:640px){#zg-bar b{order:3;flex-basis:100%;font-size:17px}}
</style>
</head>
<body>
<div id="zg">
  <div id="zg-bar">
    <a href="index.html">← Kembali belajar</a>
    <b>墨打 · Game Mengetik Hanzi</b>
    <div id="zg-dots" aria-label="Warna aksen"></div>
    <button class="zg-ic" id="zg-sound" title="Suara">🔊</button>
    <button class="zg-ic" id="zg-mode" title="Siang/malam">☀️</button>
  </div>
  <div id="zg-stage">
    <canvas id="cv"></canvas>

    <div id="zg-menu" class="zg-panel">
      <div class="zg-big">墨打</div>
      <h2>Ketik pinyin, hapus hanzinya</h2>
      <p>Hanzi jatuh dari atas. Ketik <b>pinyin tanpa nada</b> (ü = <kbd>v</kbd>), contoh 你好 → <kbd>nihao</kbd>.
         <kbd>Tab</kbd> lepas kunci · <kbd>Enter</kbd> pause · <kbd>Esc</kbd> menu. Perlu keyboard.</p>
      <select id="deck" aria-label="Pilih deck flashcard"><option>Memuat deck…</option></select>
      <p id="deckInfo"></p>
      <button class="zg-btn" id="start" disabled>Mulai 🖌️</button>
    </div>

    <div id="zg-over" class="zg-panel hide">
      <h2 style="color:var(--za)">游戏结束 · Selesai</h2>
      <p id="overDeck"></p>
      <div class="zg-stats" id="stats"></div>
      <button class="zg-btn" id="again">Main lagi</button>
      <button class="zg-btn ghost" id="toMenu">Ganti deck</button>
    </div>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s), cv=$('#cv'), ctx=cv.getContext('2d'), root=document.documentElement;
let W=800,H=500,C={};

/* ================= TEMA (ikut css/styles.css) ================= */
const ACCENTS=['vermilion','jade','indigo','gold'];
function theme(){
  const s=getComputedStyle($('#zg')),g=n=>s.getPropertyValue(n).trim();
  C={bg:g('--zb'),fg:g('--zf'),mut:g('--zm'),ac:g('--za')||'#b23a2e'};
}
function resize(){
  const r=cv.parentElement.getBoundingClientRect(),d=window.devicePixelRatio||1;
  W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
}
addEventListener('resize',resize);

ACCENTS.forEach((a,i)=>{
  const b=document.createElement('button');
  b.style.background=`var(--stamp-${i},#b23a2e)`;b.title=a;b.setAttribute('aria-label','Aksen '+a);
  if(root.dataset.accent===a)b.classList.add('on');
  b.onclick=()=>{root.dataset.accent=a;[...$('#zg-dots').children].forEach(x=>x.classList.toggle('on',x===b));theme()};
  $('#zg-dots').appendChild(b);
});
$('#zg-mode').onclick=()=>{
  root.dataset.mode=root.dataset.mode==='night'?'day':'night';
  $('#zg-mode').textContent=root.dataset.mode==='night'?'☀️':'🌙';theme();
};

/* ================= DATA: data/index.json + data/<deck>.json ================= */
// Pinyin di data berisi keterangan seperti "ài (verb)" atau "(n.) diànqì": bagian dalam kurung dibuang.
const CJK=/[\u3400-\u9fff]/;
const typed=p=>p.toLowerCase().replace(/[üǖǘǚǜ]/g,'v').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
const cleanPinyin=p=>String(p||'').replace(/\([^)]*\)/g,' ').split('/')[0].replace(/\s+/g,' ').trim();
function toCard(c){
  const z=String(c.hanzi||'').trim(),p=cleanPinyin(c.pinyin);
  if(!z||!CJK.test(z)||/\d/.test(p))return null;      // lewati kartu berangka (mis. "13米")
  const t=typed(p);if(!t)return null;
  return{z,t,p,a:String(c.arti_id||c.arti||c.arti_en||'')};
}
function friendlyName(file){                            // sama dengan label di halaman flashcard
  const base=file.replace(/\.json$/i,''),m=base.match(/^hsk[\s_-]?(\d+)/i);
  if(m)return 'HSK '+m[1];
  const s=base.replace(/^(tr|ml|min|mining)[\s_-]*/i,'').replace(/[_-]+/g,' ').toUpperCase();
  return s||'Umum';
}
async function fetchJSON(u){
  const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status+' '+u);
  return JSON.parse((await r.text()).replace(/^\uFEFF/,''));
}
const dedupe=cards=>{const seen=new Set();return cards.filter(c=>{const k=c.z+'|'+c.t;if(seen.has(k))return false;seen.add(k);return true})};

let groups=[];   // [{category, decks:[{name,cards}]}]
async function loadDecks(){
  const idx=await fetchJSON('data/index.json');
  if(!Array.isArray(idx)||!idx.length)throw new Error('index.json kosong');
  const out=[];
  for(const g of idx){
    const decks=(await Promise.all((g.decks||[]).map(async f=>{
      try{
        const j=await fetchJSON('data/'+encodeURIComponent(f.replace(/\.json$/i,''))+'.json');
        const cards=dedupe((Array.isArray(j)?j:[]).map(toCard).filter(Boolean));
        return cards.length?{name:friendlyName(f),cards}:null;
      }catch(e){console.warn(e);return null}
    }))).filter(Boolean);
    if(decks.length)out.push({category:g.category||'Lainnya',decks});
  }
  if(!out.length)throw new Error('tidak ada deck yang terbaca');
  return out;
}

// Pilihan di dropdown: satu deck, seluruh kategori, atau semua deck.
function buildSelect(){
  const sel=$('#deck');let h='';
  const total=dedupe(groups.flatMap(g=>g.decks.flatMap(d=>d.cards))).length;
  if(groups.length>1)h+=`<option value="all">Semua deck (${total} kata)</option>`;
  groups.forEach((g,gi)=>{
    h+=`<optgroup label="${g.category}">`;
    if(g.decks.length>1)h+=`<option value="c:${gi}">Semua ${g.category} (${dedupe(g.decks.flatMap(d=>d.cards)).length} kata)</option>`;
    g.decks.forEach((d,di)=>{h+=`<option value="d:${gi}:${di}">${d.name} (${d.cards.length} kata)</option>`});
    h+='</optgroup>';
  });
  sel.innerHTML=h;
  const first=sel.querySelector('option[value^="d:"]');if(first)sel.value=first.value;
}
function pool(){
  const v=$('#deck').value;
  if(v==='all')return{name:'Semua deck',cards:dedupe(groups.flatMap(g=>g.decks.flatMap(d=>d.cards)))};
  const[k,a,b]=v.split(':'),g=groups[+a];
  if(k==='c')return{name:'Semua '+g.category,cards:dedupe(g.decks.flatMap(d=>d.cards))};
  return{name:g.decks[+b].name,cards:g.decks[+b].cards};
}

const SAMPLE=[['你好','nǐ hǎo','halo'],['谢谢','xièxie','terima kasih'],['再见','zàijiàn','sampai jumpa'],['朋友','péngyou','teman'],['老师','lǎoshī','guru'],['学生','xuésheng','murid'],['中国','Zhōngguó','Tiongkok'],['水','shuǐ','air'],['茶','chá','teh'],['书','shū','buku'],['钱','qián','uang'],['吃','chī','makan'],['喝','hē','minum'],['看','kàn','melihat'],['爱','ài','cinta']]
  .map(([z,p,a])=>({z,p,a,t:typed(p)}));

loadDecks().then(g=>{groups=g;buildSelect();$('#start').disabled=false})
.catch(err=>{
  console.warn(err);
  groups=[{category:'Contoh',decks:[{name:'Kata contoh',cards:SAMPLE}]}];buildSelect();$('#start').disabled=false;
  $('#deckInfo').innerHTML='<span class="zg-warn">data/index.json tidak terbaca</span> — memakai kata contoh. Buka lewat hosting atau server lokal (fetch tidak jalan kalau file dibuka langsung).';
});

/* ================= SUARA (WebAudio, tanpa file) ================= */
let AC,mute=false;
function snd(f0,f1,d,v=.15,type='sine',nz=0){
  if(mute)return;AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const t=AC.currentTime,g=AC.createGain();
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);g.connect(AC.destination);
  if(nz){
    const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
    for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
    const s=AC.createBufferSource(),f=AC.createBiquadFilter();
    s.buffer=b;f.type='lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+d);
    s.connect(f);f.connect(g);s.start(t);
  }else{
    const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);
    o.connect(g);o.start(t);o.stop(t+d);
  }
}
const seq=(fs,gap,fn)=>fs.forEach((f,i)=>setTimeout(()=>fn(f),i*gap));
const S={
  shoot:()=>snd(900,300,.09,.1,'triangle'),hit:()=>snd(300,120,.08,.15),
  boom:()=>snd(1500,60,.5,.5,'sine',1),err:()=>snd(160,100,.18,.1,'sawtooth'),
  life:()=>snd(400,50,.6,.2,'sawtooth'),
  up:()=>seq([523,659,784,1047],90,f=>snd(f,f,.1,.1,'square')),
  over:()=>seq([392,330,262,196],200,f=>snd(f,f*.95,.22,.12,'sawtooth'))
};
const PENTA=[261.6,293.7,329.6,392,440,523.3];let musicT;
const music=on=>{clearInterval(musicT);if(on)musicT=setInterval(()=>{if(st==='play'&&!paused)snd(PENTA[Math.random()*6|0],PENTA[Math.random()*6|0],1.6,.04)},1400)};
$('#zg-sound').onclick=()=>{mute=!mute;$('#zg-sound').textContent=mute?'🔇':'🔊'};

/* ================= STATE GAME ================= */
let st='menu',paused=false,words=[],es=[],bs=[],ps=[],pops=[],tg=null,
    lives,score,level,kills,combo,best,ok,bad,time,spT,deckName='',T=0;
const R=(a,b)=>a+Math.random()*(b-a);
const cut=s=>s.length>30?s.slice(0,29)+'…':s;

function start(){
  const p=pool();words=p.cards;deckName=p.name;
  es=[];bs=[];ps=[];pops=[];tg=null;lives=3;score=0;level=1;kills=0;combo=0;best=0;ok=0;bad=0;time=0;spT=.5;
  st='play';paused=false;
  $('#zg-menu').classList.add('hide');$('#zg-over').classList.add('hide');
  document.activeElement.blur();music(true);
}
function toMenu(){
  st='menu';paused=false;music(false);
  $('#zg-over').classList.add('hide');$('#zg-menu').classList.remove('hide');
}
function spawn(){
  const used=new Set(es.filter(e=>!e.dead).map(e=>e.t[0])),c=words.filter(w=>!used.has(w.t[0]));
  if(!c.length)return;
  const w=c[Math.random()*c.length|0],n=[...w.z].length,fs=Math.max(26,Math.min(56,W*.42/n));
  ctx.font=`900 ${fs}px "Noto Serif SC",serif`;const hw=Math.max(ctx.measureText(w.z).width+36,84);
  ctx.font='800 22px Manrope,sans-serif';const ew=Math.max(hw,ctx.measureText(w.t).width+20);   // lebar termasuk huruf pinyin di bawahnya
  es.push({...w,fs,bw:hw,ew,bh:80,x:R(ew/2+20,Math.max(ew/2+21,W-ew/2-20)),y:-90,
    sp:(30+level*5+R(0,12))*H/660,n:0,fin:false,dead:false,fl:0,ph:R(0,6.28)});
}
function key(ch){
  if(!tg){
    const c=es.filter(e=>!e.dead&&!e.fin&&e.t[0]===ch);
    if(!c.length)return miss();
    tg=c.reduce((a,b)=>b.y>a.y?b:a);
  }
  if(tg.t[tg.n]===ch){
    tg.n++;ok++;combo++;best=Math.max(best,combo);score+=10*(1+(combo/10|0));
    const last=tg.n===tg.t.length,p=tip();
    bs.push({x:p[0],y:p[1],e:tg,last});S.shoot();
    if(last){tg.fin=true;tg=null}
  }else miss();
}
function miss(){bad++;combo=0;S.err()}
function splat(x,y,n=22,col=C.ac){for(let i=0;i<n;i++){const a=R(0,6.28),v=R(40,260);ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:R(.35,.9),r:R(2,7),c:col})}}
const shipXY=()=>[W/2,H-70];
const ang=()=>{const[x,y]=shipXY();return tg&&!tg.dead?Math.atan2(tg.x-x,y-(tg.y+40)):0};
const tip=()=>{const[x,y]=shipXY(),a=ang();return[x+Math.sin(a)*52,y-Math.cos(a)*52]};

/* ================= UPDATE ================= */
function update(dt){
  if(st!=='play'||paused)return;
  T+=dt;time+=dt;spT-=dt;
  if(spT<=0){spawn();spT=Math.max(.8,2.8-level*.18)+R(0,.7)}
  for(const e of es){
    e.y+=e.sp*dt;e.fl=Math.max(0,e.fl-dt);
    e.x+=Math.sin(T*1.4+e.ph)*14*dt;e.x=Math.max(e.ew/2+4,Math.min(W-e.ew/2-4,e.x));
    if(!e.dead&&e.y+e.bh+22>H-100){
      e.dead=true;if(tg===e)tg=null;lives--;combo=0;splat(e.x,e.y+40,40,'#c0392b');S.life();
    }
  }
  for(let i=bs.length-1;i>=0;i--){
    const b=bs[i];if(b.e.dead&&!b.last){bs.splice(i,1);continue}
    const dx=b.e.x-b.x,dy=b.e.y+40-b.y,d=Math.hypot(dx,dy),s=1000*dt;
    if(d<=s){
      bs.splice(i,1);b.e.fl=.12;splat(b.e.x,b.e.y+40,6,C.fg);S.hit();
      if(b.last&&!b.e.dead){
        b.e.dead=true;splat(b.e.x,b.e.y+40,34);S.boom();score+=50*b.e.t.length;
        // setelah hancur, tampilkan pinyin bernada + arti supaya tetap belajar
        pops.push({x:Math.max(110,Math.min(W-110,b.e.x)),y:b.e.y+40,l:1.8,p:b.e.p,a:cut(b.e.a)});
        if(++kills%10===0){level++;S.up()}
      }
    }else{b.x+=dx/d*s;b.y+=dy/d*s}
  }
  es=es.filter(e=>!e.dead);
  for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;if((p.l-=dt)<=0)ps.splice(i,1)}
  for(let i=pops.length-1;i>=0;i--)if((pops[i].l-=dt)<=0)pops.splice(i,1);
  if(lives<=0)over();
}
function over(){
  st='over';music(false);S.over();
  const wpm=time>3?ok/5/(time/60):0,acc=ok+bad?100*ok/(ok+bad):100;
  $('#overDeck').textContent='Deck: '+deckName;
  $('#stats').innerHTML=[['Skor',score],['Level',level],['Kata',kills],['WPM',wpm.toFixed(0)],['Akurasi',acc.toFixed(0)+'%'],['Combo maks',best]]
    .map(([k,v])=>`<div><span>${k}</span>${v}</div>`).join('');
  $('#zg-over').classList.remove('hide');
}

/* ================= GAMBAR ================= */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function draw(){
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  // noda tinta lembut + garis kolom tipis
  for(const[fx,fy,r,a]of[[.2,.3,.45,.07],[.8,.65,.5,.06],[.5,.1,.35,.05]]){
    const g=ctx.createRadialGradient(W*fx,H*fy,0,W*fx,H*fy,H*r);g.addColorStop(0,C.mut);g.addColorStop(1,'transparent');
    ctx.globalAlpha=a;ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  ctx.globalAlpha=.12;ctx.strokeStyle=C.mut;ctx.lineWidth=1;
  for(let x=W/8;x<W;x+=W/8){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  ctx.globalAlpha=1;
  if(st==='menu')return;

  for(const e of es){
    const lock=e===tg,l=e.x-e.bw/2;
    rr(l,e.y,e.bw,e.bh,10);ctx.fillStyle=C.ac;ctx.globalAlpha=e.fl>0?.45:.16;ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle=C.ac;ctx.lineWidth=lock?4:2;ctx.stroke();
    ctx.fillStyle=C.fg;ctx.font=`900 ${e.fs}px "Noto Serif SC",serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(e.z,e.x,e.y+e.bh/2+3);
    ctx.fillStyle=C.ac;ctx.font='800 22px Manrope,sans-serif';ctx.textBaseline='top';
    ctx.fillText(e.t.slice(0,e.n),e.x,e.y+e.bh+6);                // huruf yang sudah benar
    if(lock){
      const[sx,sy]=shipXY();ctx.setLineDash([6,8]);ctx.strokeStyle=C.mut;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(sx,sy-50);ctx.lineTo(e.x,e.y+e.bh);ctx.stroke();ctx.setLineDash([]);
    }
  }
  for(const b of bs){ctx.fillStyle=C.ac;ctx.beginPath();ctx.arc(b.x,b.y,5,0,6.3);ctx.fill()}
  for(const p of ps){ctx.globalAlpha=Math.min(1,p.l*2);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.3);ctx.fill()}
  ctx.globalAlpha=1;

  // pinyin + arti setelah kata hancur
  for(const q of pops){
    const k=1.8-q.l,y=q.y-k*30;
    ctx.globalAlpha=Math.min(1,q.l*1.2);ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.fillStyle=C.fg;ctx.font='700 18px Manrope,sans-serif';ctx.fillText(q.p,q.x,y);
    if(q.a){ctx.fillStyle=C.mut;ctx.font='600 14px Manrope,sans-serif';ctx.fillText(q.a,q.x,y+20)}
  }
  ctx.globalAlpha=1;

  // kuas (kapal)
  const[x,y]=shipXY();ctx.save();ctx.translate(x,y);ctx.rotate(ang());
  ctx.fillStyle=C.fg;ctx.fillRect(-4,-4,8,58);
  ctx.fillStyle=C.ac;ctx.beginPath();ctx.moveTo(-10,-4);ctx.quadraticCurveTo(-12,-32,0,-54);ctx.quadraticCurveTo(12,-32,10,-4);ctx.closePath();ctx.fill();
  ctx.restore();

  // HUD
  const wpm=time>3?ok/5/(time/60):0,acc=ok+bad?100*ok/(ok+bad):100;
  ctx.textAlign='left';ctx.textBaseline='top';ctx.fillStyle=C.fg;ctx.font='700 16px Manrope,sans-serif';
  ctx.fillText(`分 ${score}   Level ${level}   Combo ${combo}`,16,14);
  ctx.fillStyle=C.mut;ctx.font='600 13px Manrope,sans-serif';
  ctx.fillText(`WPM ${wpm.toFixed(0)} · Akurasi ${acc.toFixed(0)}% · ${deckName}`,16,38);
  // nyawa = tiga stempel 命
  for(let i=0;i<3;i++){
    const sx=W-50-i*44,sy=H-56;rr(sx,sy,34,34,6);
    if(i<lives){ctx.fillStyle=C.ac;ctx.fill();ctx.fillStyle='#fff'}else{ctx.strokeStyle=C.mut;ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=C.mut}
    ctx.font='900 22px "Noto Serif SC",serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('命',sx+17,sy+18);
  }
  if(paused){
    ctx.fillStyle=C.bg;ctx.globalAlpha=.7;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
    ctx.fillStyle=C.ac;ctx.font='400 80px "Ma Shan Zheng",serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('暂停 · PAUSE',W/2,H/2-20);
  }
}

/* ================= INPUT & LOOP ================= */
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&st!=='menu'){toMenu();return}
  if(st==='menu'&&e.key==='Enter'&&document.activeElement.tagName!=='BUTTON'&&!$('#start').disabled){start();return}
  if(st!=='play')return;
  if(e.key==='Enter'){paused=!paused;return}
  if(e.key==='Tab'){e.preventDefault();tg=null;return}
  if(!paused&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[a-z]$/i.test(e.key)){e.preventDefault();key(e.key.toLowerCase())}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st==='play')paused=true});   // otomatis pause saat pindah tab
$('#start').onclick=start;$('#again').onclick=start;$('#toMenu').onclick=toMenu;

let last=performance.now();
(function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)})(last);
theme();resize();
if(document.fonts&&document.fonts.load){document.fonts.load('900 56px "Noto Serif SC"','你好');document.fonts.load('800 22px Manrope','abc')}
})();
</script>
