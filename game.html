<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content">
<title>墨打 · Game Mengetik Hanzi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0e1c20}
#zg{position:fixed;left:0;right:0;top:0;bottom:0;z-index:50;display:flex;flex-direction:column;font-family:Manrope,system-ui,sans-serif;
  --zb:#0e1c20;--zs:#14292e;--zf:#e8f2f2;--zm:#7c929a;--za:#ff8c1e;--zc:#28e6e6;
  background:var(--zb);color:var(--zf);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#zg *{box-sizing:border-box}
#zg-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:2px solid var(--zc)}
#zg-bar a,#zg-bar button{color:var(--zf);text-decoration:none;font:700 14px Manrope,sans-serif;background:none;border:1.5px solid var(--zm);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
#zg-bar button{padding:6px 11px;min-width:38px}
#zg-bar b{flex:1;text-align:center;font:900 19px "Noto Sans SC",Manrope,sans-serif;letter-spacing:.06em;color:var(--zc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#zg-stage{flex:1;position:relative;min-height:0}
#cv{display:block;width:100%;height:100%}
.zg-panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  background:rgba(8,18,21,.82);padding:20px;overflow:auto}
.zg-panel.hide{display:none}
.zg-big{font:900 clamp(64px,13vw,130px)/1 "Noto Sans SC",sans-serif;color:var(--zc);text-shadow:0 0 36px rgba(40,230,230,.45)}
.zg-panel h2{margin:0;font:800 24px Manrope,sans-serif}
.zg-panel p{margin:0;color:var(--zm);font-size:14px;max-width:540px;line-height:1.6}
.zg-panel p b{color:var(--zf)}
.zg-panel select,.zg-btn{font:700 16px Manrope,sans-serif;padding:12px 22px;border-radius:12px;border:2px solid var(--zm);background:var(--zs);color:var(--zf);min-width:min(320px,88vw);max-width:92vw}
.zg-btn{background:var(--za);border-color:var(--za);color:#1a1006;cursor:pointer;box-shadow:4px 4px 0 rgba(255,140,30,.35)}
.zg-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(255,140,30,.35)}
.zg-btn.ghost{background:none;color:var(--zf);border-color:var(--zm);box-shadow:none}
.zg-stats{display:grid;grid-template-columns:repeat(3,auto);gap:10px 28px;font:700 18px Manrope,sans-serif}
.zg-stats span{display:block;color:var(--zm);font-size:12px;font-weight:600}
.zg-warn{color:var(--za)}
kbd{border:1.5px solid var(--zm);border-radius:6px;padding:1px 7px;font-size:12px}
#kb{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;pointer-events:none}
#zg :focus-visible{outline:2px solid var(--zc);outline-offset:2px}
@media (max-width:560px){#zg-bar b{display:none}#zg-bar a{flex:1;text-align:center}}
</style>
</head>
<body>
<div id="zg">
  <div id="zg-bar">
    <a href="index.html">← Kembali belajar</a>
    <b>墨打 · Game Mengetik Hanzi</b>
    <button id="zg-free" title="Lepas kunci kata (Tab)" aria-label="Lepas kunci">🔓</button>
    <button id="zg-pause" title="Pause (Enter)" aria-label="Pause">‖</button>
    <button id="zg-menu-btn" title="Menu (Esc)" aria-label="Menu">⌂</button>
    <button id="zg-sound" title="Suara" aria-label="Suara">🔊</button>
  </div>
  <div id="zg-stage">
    <canvas id="cv"></canvas>

    <div id="zg-menu" class="zg-panel">
      <div class="zg-big">墨打</div>
      <h2>Ketik pinyin, hancurkan hanzinya</h2>
      <p>Hanzi jatuh dari atas. Ketik <b>pinyin tanpa nada</b> (ü = <kbd>v</kbd>), contoh 你好 → <kbd>nihao</kbd>.
         Di komputer: <kbd>Tab</kbd> lepas kunci · <kbd>Enter</kbd> pause · <kbd>Esc</kbd> menu.
         Di HP: pakai keyboard layar dan tombol di atas.</p>
      <select id="deck" aria-label="Pilih deck flashcard"><option>Memuat deck…</option></select>
      <p id="deckInfo"></p>
      <button class="zg-btn" id="start" disabled>Mulai 🚀</button>
      <button class="zg-btn ghost" id="retry" hidden>Coba muat lagi</button>
    </div>

    <div id="zg-over" class="zg-panel hide">
      <h2 style="color:var(--za)">Game Over</h2>
      <p id="overDeck"></p>
      <div class="zg-stats" id="stats"></div>
      <button class="zg-btn" id="again">Main lagi</button>
      <button class="zg-btn ghost" id="toMenu">Ganti deck</button>
    </div>
  </div>
  <!-- penerima ketikan dari keyboard HP (Android mengirim event "input", bukan keydown huruf) -->
  <input id="kb" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-label="Ketik pinyin di sini">
</div>

<script>
(()=>{
const $=s=>document.querySelector(s), cv=$('#cv'), ctx=cv.getContext('2d'), root=document.documentElement;
let W=800,H=500,K=1;

/* ================= TEMA LUAR ANGKASA ================= */
const C={bg:'#0e1c20',grid:'#142a2e',fg:'#ffffff',mut:'#7c929a',ac:'#ff8c1e',cy:'#28e6e6',yl:'#ffdc3c'};
const HZ='"Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
const zg=$('#zg'),kb=$('#kb');
function resize(){
  const vv=window.visualViewport;                       // saat keyboard HP muncul, area game ikut mengecil
  if(vv){zg.style.height=vv.height+'px';zg.style.top=vv.offsetTop+'px';zg.style.bottom='auto'}
  const r=cv.parentElement.getBoundingClientRect(),d=window.devicePixelRatio||1;
  W=Math.max(200,r.width);H=Math.max(200,r.height);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  // K = skala ukuran sesuai perangkat (HP kecil -> kotak, font, kapal ikut mengecil)
  K=Math.max(.42,Math.min(1.1,Math.min(W/760,H/560)));
  if(typeof es!=='undefined')for(const e of es){layout(e);sync(e)}
}
addEventListener('resize',resize);
if(window.visualViewport){visualViewport.addEventListener('resize',resize);visualViewport.addEventListener('scroll',resize)}
const stars=Array.from({length:150},()=>({x:Math.random(),y:Math.random(),v:8+Math.random()*32}));

/* ================= DATA: data/index.json + data/<deck>.json ================= */
// Pinyin di data berisi keterangan seperti "ài (verb)" atau "(n.) diànqì": bagian dalam kurung dibuang.
const CJK=/[\u3400-\u9fff]/;
const typed=p=>p.toLowerCase().replace(/[üǖǘǚǜ]/g,'v').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
const cleanPinyin=p=>String(p||'').replace(/\([^)]*\)/g,' ').split('/')[0].replace(/\s+/g,' ').trim();
function toCard(c){
  const z=String(c.hanzi||'').trim(),p=cleanPinyin(c.pinyin);
  if(!z||!CJK.test(z)||/\d/.test(p))return null;      // lewati kartu berangka (mis. "13米")
  const t=typed(p);if(!t)return null;
  return{z,t,p,a:String(c.arti_id||c.arti||c.arti_en||'')};
}
function friendlyName(file){                            // sama dengan label di halaman flashcard
  const base=file.replace(/\.json$/i,''),m=base.match(/^hsk[\s_-]?(\d+)/i);
  if(m)return 'HSK '+m[1];
  const s=base.replace(/^(tr|ml|min|mining)[\s_-]*/i,'').replace(/[_-]+/g,' ').toUpperCase();
  return s||'Umum';
}
const dedupe=cards=>{const seen=new Set();return cards.filter(c=>{const k=c.z+'|'+c.t;if(seen.has(k))return false;seen.add(k);return true})};
const note=(msg,warn)=>{const n=$('#deckInfo');n.textContent=msg;n.className=warn?'zg-warn':''};

// Coba beberapa lokasi folder data supaya tetap jalan di berbagai pengaturan hosting.
async function fetchJSON(file){
  let last;
  for(const base of['data/','./data/','/data/']){
    const url=base+file;
    try{
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status+' ('+url+')');
      return JSON.parse((await r.text()).replace(/^\uFEFF/,''));
    }catch(e){last=e}
  }
  throw last;
}

let groups=[];   // [{category, decks:[{file,name,cards,err,p}]}]  — isi deck dimuat sesuai kebutuhan
function normManifest(m){
  if(m&&!Array.isArray(m)&&Array.isArray(m.categories))m=m.categories;
  if(Array.isArray(m)&&m.length&&typeof m[0]==='string')m=[{category:'Deck',decks:m}];
  if(!Array.isArray(m))throw new Error('format index.json tidak dikenali');
  const out=m.map(g=>({category:g.category||'Lainnya',
    decks:(g.decks||[]).map(d=>typeof d==='string'?d:(d.file||d.name)).filter(Boolean)
      .map(f=>({file:f,name:friendlyName(f),cards:null,err:null,p:null}))})).filter(g=>g.decks.length);
  if(!out.length)throw new Error('index.json kosong');
  return out;
}
function ensure(d){                                   // muat satu deck (di-cache; kalau gagal bisa dicoba lagi)
  if(d.cards)return Promise.resolve(d);
  if(!d.p)d.p=fetchJSON(d.file.replace(/\.json$/i,'')+'.json').then(j=>{
    const cards=dedupe((Array.isArray(j)?j:[]).map(toCard).filter(Boolean));
    if(!cards.length)throw new Error('tidak ada kartu yang bisa dimainkan di '+d.file);
    d.cards=cards;d.err=null;return d;
  }).catch(e=>{d.err=e.message||String(e);d.p=null;throw e});
  return d.p;
}
function optLabel(v){
  const cnt=ds=>ds.every(d=>d.cards)?' ('+dedupe(ds.flatMap(d=>d.cards)).length+' kata)':'';
  if(v==='all'){const ds=groups.flatMap(g=>g.decks);return'Semua deck'+cnt(ds)}
  const[k,a,b]=v.split(':'),g=groups[+a];
  if(k==='c')return'Semua '+g.category+cnt(g.decks);
  const d=g.decks[+b];return d.name+(d.cards?' ('+d.cards.length+' kata)':d.err?' ⚠':'');
}
const refreshLabels=()=>[...$('#deck').options].forEach(o=>{o.textContent=optLabel(o.value)});
function buildSelect(){
  const sel=$('#deck');sel.innerHTML='';
  const add=(parent,v)=>{const o=document.createElement('option');o.value=v;o.textContent=optLabel(v);parent.appendChild(o)};
  if(groups.length>1)add(sel,'all');
  groups.forEach((g,gi)=>{
    const og=document.createElement('optgroup');og.label=g.category;sel.appendChild(og);
    if(g.decks.length>1)add(og,'c:'+gi);
    g.decks.forEach((d,di)=>add(og,'d:'+gi+':'+di));
  });
  const first=sel.querySelector('option[value^="d:"]');if(first)sel.value=first.value;
}
async function pool(){                                // kumpulkan kartu dari pilihan dropdown
  const v=$('#deck').value;let ds,name;
  if(v==='all'){ds=groups.flatMap(g=>g.decks);name='Semua deck'}
  else{const[k,a,b]=v.split(':'),g=groups[+a];ds=k==='c'?g.decks:[g.decks[+b]];name=k==='c'?'Semua '+g.category:g.decks[+b].name}
  await Promise.allSettled(ds.map(ensure));
  const okd=ds.filter(d=>d.cards);
  if(!okd.length)throw new Error(ds[0].file+' — '+(ds[0].err||'gagal dimuat'));
  return{name,cards:dedupe(okd.flatMap(d=>d.cards)),failed:ds.length-okd.length};
}

const SAMPLE=[['你好','nǐ hǎo','halo'],['谢谢','xièxie','terima kasih'],['再见','zàijiàn','sampai jumpa'],['朋友','péngyou','teman'],['老师','lǎoshī','guru'],['学生','xuésheng','murid'],['中国','Zhōngguó','Tiongkok'],['水','shuǐ','air'],['茶','chá','teh'],['书','shū','buku'],['钱','qián','uang'],['吃','chī','makan'],['喝','hē','minum'],['看','kàn','melihat'],['爱','ài','cinta']]
  .map(([z,p,a])=>({z,p,a,t:typed(p)}));

async function init(){
  $('#retry').hidden=true;$('#start').disabled=true;note('Memuat daftar deck…');
  try{
    groups=normManifest(await fetchJSON('index.json'));
    buildSelect();$('#start').disabled=false;note('');
    // muat semua deck di latar belakang supaya jumlah kata muncul; kegagalan satu deck tidak menghentikan yang lain
    const all=groups.flatMap(g=>g.decks);
    Promise.allSettled(all.map(d=>ensure(d).finally(refreshLabels))).then(()=>{
      const bad=all.filter(d=>d.err);
      if(bad.length)note(bad.length+' dari '+all.length+' deck gagal dimuat (contoh: '+bad[0].file+' — '+bad[0].err+'). Deck lain tetap bisa dimainkan.',true);
    });
  }catch(err){
    console.warn(err);
    groups=[{category:'Contoh',decks:[{file:'contoh',name:'Kata contoh',cards:SAMPLE,err:null,p:null}]}];
    buildSelect();$('#start').disabled=false;$('#retry').hidden=false;
    note('Gagal memuat data/index.json: '+(err.message||err)+(location.protocol==='file:'?' — halaman dibuka langsung dari file; jalankan lewat hosting/server lokal.':'')+' Sementara memakai kata contoh.',true);
  }
}
$('#retry').onclick=init;
init();

/* ================= SUARA (WebAudio, tanpa file) ================= */
let AC,mute=false;
function snd(f0,f1,d,v=.15,type='sine',nz=0){
  if(mute)return;AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const t=AC.currentTime,g=AC.createGain();
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);g.connect(AC.destination);
  if(nz){
    const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
    for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
    const s=AC.createBufferSource(),f=AC.createBiquadFilter();
    s.buffer=b;f.type='lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+d);
    s.connect(f);f.connect(g);s.start(t);
  }else{
    const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);
    o.connect(g);o.start(t);o.stop(t+d);
  }
}
const seq=(fs,gap,fn)=>fs.forEach((f,i)=>setTimeout(()=>fn(f),i*gap));
const S={
  shoot:()=>snd(900,300,.09,.1,'triangle'),hit:()=>snd(300,120,.08,.15),
  boom:()=>snd(1500,60,.5,.5,'sine',1),err:()=>snd(160,100,.18,.1,'sawtooth'),
  life:()=>snd(400,50,.6,.2,'sawtooth'),
  up:()=>seq([523,659,784,1047],90,f=>snd(f,f,.1,.1,'square')),
  over:()=>seq([392,330,262,196],200,f=>snd(f,f*.95,.22,.12,'sawtooth'))
};
const PENTA=[261.6,293.7,329.6,392,440,523.3];let musicT;
const music=on=>{clearInterval(musicT);if(on)musicT=setInterval(()=>{if(st==='play'&&!paused)snd(PENTA[Math.random()*6|0],PENTA[Math.random()*6|0],1.6,.04)},1400)};
$('#zg-sound').onclick=()=>{mute=!mute;$('#zg-sound').textContent=mute?'🔇':'🔊'};

/* ================= STATE GAME ================= */
let st='menu',paused=false,words=[],es=[],bs=[],ps=[],pops=[],tg=null,
    lives,score,level,kills,combo,best,ok,bad,time,spT,deckName='',T=0;
const R=(a,b)=>a+Math.random()*(b-a);
const cut=s=>s.length>30?s.slice(0,29)+'…':s;

const preloadFont=cards=>document.fonts&&document.fonts.load('700 56px "Noto Sans SC"',[...new Set(cards.map(c=>c.z).join(''))].join('')).catch(()=>{});
function begin(p){
  preloadFont(p.cards);words=p.cards;deckName=p.name;
  es=[];bs=[];ps=[];pops=[];tg=null;lives=3;score=0;level=1;kills=0;combo=0;best=0;ok=0;bad=0;time=0;spT=.5;
  st='play';paused=false;$('#zg-pause').textContent='‖';
  $('#zg-menu').classList.add('hide');$('#zg-over').classList.add('hide');
  music(true);
}
let starting=false;
async function start(){
  if(starting)return;starting=true;
  kb.value='';kb.focus({preventScroll:true});             // fokus harus dalam sentuhan pengguna agar keyboard HP terbuka
  const btn=$('#start');btn.disabled=true;btn.textContent='Memuat deck…';
  try{
    const p=await pool();begin(p);
    if(p.failed)note(p.failed+' deck dalam pilihan ini gagal dimuat dan dilewati.',true);
  }catch(e){
    console.warn(e);kb.blur();toMenu();
    note('Gagal memuat deck: '+(e.message||e)+'. Coba pilih deck lain atau tekan Mulai lagi.',true);
  }finally{starting=false;btn.disabled=false;btn.textContent='Mulai 🚀'}
}
function toMenu(){
  kb.blur();st='menu';paused=false;music(false);
  $('#zg-over').classList.add('hide');$('#zg-menu').classList.remove('hide');
}
// Ukuran satu kata (semua dikali K supaya pas di HP maupun desktop)
function layout(e){
  const n=[...e.z].length;
  e.fs=Math.max(20,Math.min(56*K,W*.4/n));                 // font hanzi
  e.pf=Math.max(13,22*K);                                  // font pinyin
  ctx.font=`700 ${e.fs}px ${HZ}`;const hw=Math.max(ctx.measureText(e.z).width+36*K,84*K);
  ctx.font=`800 ${e.pf}px Manrope,sans-serif`;const pw=ctx.measureText(e.t).width+16*K;
  e.bw=Math.min(W-8,hw);e.ew=Math.min(W-8,Math.max(hw,pw));e.bh=80*K;e.th=e.bh+e.pf+14*K;   // th = tinggi kotak + baris pinyin
}
// Posisi disimpan sebagai pecahan layar (fx, fy), jadi saat keyboard HP naik/turun jarak jatuh tetap proporsional
function sync(e){e.x=e.fx*W;e.y=e.fy*H}
function spawn(){
  const used=new Set(es.filter(e=>!e.dead).map(e=>e.t[0])),c=words.filter(w=>!used.has(w.t[0]));
  if(!c.length)return true;
  const e={...words.length?c[Math.random()*c.length|0]:{},n:0,fin:false,dead:false,fl:0,ph:R(0,6.28),sp:(26+level*5+R(0,12))/660};
  layout(e);e.fy=-e.th/H;e.y=e.fy*H;
  const gap=14*K;let free=false;
  for(let i=0;i<14&&!free;i++){                            // cari posisi yang tidak menimpa kata lain
    const m=e.ew/2/W+.01;e.fx=R(m,Math.max(m+.001,1-m));
    free=es.every(o=>o.dead||o.y>e.y+e.th+gap||Math.abs(o.fx-e.fx)*W>(o.ew+e.ew)/2+gap);
  }
  if(!free)return false;
  sync(e);es.push(e);return true;
}
function key(ch){
  if(!tg){
    const c=es.filter(e=>!e.dead&&!e.fin&&e.t[0]===ch);
    if(!c.length)return miss();
    tg=c.reduce((a,b)=>b.y>a.y?b:a);
  }
  if(tg.t[tg.n]===ch){
    tg.n++;ok++;combo++;best=Math.max(best,combo);score+=10*(1+(combo/10|0));
    const last=tg.n===tg.t.length,p=tip();
    bs.push({x:p[0],y:p[1],e:tg,last});S.shoot();
    if(last){tg.fin=true;tg=null}
  }else miss();
}
function miss(){bad++;combo=0;S.err()}
function splat(x,y,n=22,col='#ffa028'){for(let i=0;i<n;i++){const a=R(0,6.28),v=R(40,260);ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:R(.35,.9),r:R(2,7),c:col})}}
const shipXY=()=>[W/2,H*.92];
const shipK=()=>Math.max(.8,Math.min(1.2,K*1.6));
const ang=()=>{const[x,y]=shipXY();return tg&&!tg.dead?Math.atan2(tg.x-x,y-(tg.y+tg.bh/2)):0};
const tip=()=>{const[x,y]=shipXY(),a=ang();const k=shipK()*24;return[x+Math.sin(a)*k,y-Math.cos(a)*k]};

/* ================= UPDATE ================= */
function update(dt){
  for(const t of stars){t.y+=t.v*dt/H;if(t.y>1){t.y=0;t.x=Math.random()}}
  if(st!=='play'||paused)return;
  T+=dt;time+=dt;spT-=dt;
  if(spT<=0){spT=spawn()?Math.max(.8,2.8-level*.18)+R(0,.7):.3}
  for(const e of es){
    e.fy+=e.sp*dt;e.fl=Math.max(0,e.fl-dt);
    e.fx+=Math.sin(T*1.4+e.ph)*.012*dt;const lo=e.ew/2/W+.004;e.fx=Math.max(lo,Math.min(1-lo,e.fx));// jangan menyusul/menimpa kata lain yang ada tepat di depannya
    for(const o of es){
      if(o===e||o.dead||o.fy<=e.fy)continue;
      if(Math.abs(o.fx-e.fx)*W<(o.ew+e.ew)/2+8*K)e.fy=Math.min(e.fy,o.fy-(e.th+10*K)/H);
    }
    sync(e);
    if(!e.dead&&e.fy>.76){      // garis bahaya = 76% tinggi layar, sama di semua perangkat
      e.dead=true;if(tg===e)tg=null;lives--;combo=0;splat(e.x,e.y+e.bh/2,40,'#ff3c3c');S.life();
    }
  }
  for(let i=bs.length-1;i>=0;i--){
    const b=bs[i];if(b.e.dead&&!b.last){bs.splice(i,1);continue}
    const dx=b.e.x-b.x,dy=b.e.y+b.e.bh/2-b.y,d=Math.hypot(dx,dy),s=1000*dt;
    if(d<=s){
      bs.splice(i,1);b.e.fl=.12;splat(b.e.x,b.e.y+b.e.bh/2,6,'#ffdc78');S.hit();
      if(b.last&&!b.e.dead){
        b.e.dead=true;splat(b.e.x,b.e.y+b.e.bh/2,34);S.boom();score+=50*b.e.t.length;
        // setelah hancur, tampilkan pinyin bernada + arti supaya tetap belajar
        pops.push({x:Math.max(90,Math.min(W-90,b.e.x)),y:b.e.y+b.e.bh/2,l:1.8,p:b.e.p,a:cut(b.e.a)});
        if(++kills%10===0){level++;S.up()}
      }
    }else{b.x+=dx/d*s;b.y+=dy/d*s}
  }
  es=es.filter(e=>!e.dead);
  for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;if((p.l-=dt)<=0)ps.splice(i,1)}
  for(let i=pops.length-1;i>=0;i--)if((pops[i].l-=dt)<=0)pops.splice(i,1);
  if(lives<=0)over();
}
function over(){
  kb.blur();st='over';music(false);S.over();
  const wpm=time>3?ok/5/(time/60):0,acc=ok+bad?100*ok/(ok+bad):100;
  $('#overDeck').textContent='Deck: '+deckName;
  $('#stats').innerHTML=[['Skor',score],['Level',level],['Kata',kills],['WPM',wpm.toFixed(0)],['Akurasi',acc.toFixed(0)+'%'],['Combo maks',best]]
    .map(([k,v])=>`<div><span>${k}</span>${v}</div>`).join('');
  $('#zg-over').classList.remove('hide');
}

/* ================= GAMBAR ================= */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
const touch=matchMedia('(pointer:coarse)').matches;
function drawShip(){
  const[x,y]=shipXY(),pts=[[0,-22],[14,16],[0,8],[-14,16]];
  ctx.save();ctx.translate(x,y);ctx.rotate(ang());ctx.scale(shipK(),shipK());ctx.strokeStyle=C.cy;ctx.lineWidth=2.5;ctx.lineJoin='round';
  ctx.beginPath();pts.forEach(([px,py],i)=>i?ctx.lineTo(px,py):ctx.moveTo(px,py));ctx.closePath();ctx.stroke();
  ctx.fillStyle=C.cy;ctx.beginPath();ctx.arc(0,0,3,0,6.3);ctx.fill();ctx.restore();
}
function draw(){
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=C.grid;ctx.lineWidth=1;ctx.beginPath();
  for(let x=0;x<W;x+=24){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H)}
  for(let y=0;y<H;y+=24){ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5)}
  ctx.stroke();
  for(const t of stars){const c=Math.round(60+t.v*4);ctx.fillStyle=`rgb(${c},${c},${c+20})`;ctx.fillRect(t.x*W,t.y*H,1.6,1.6)}
  if(st==='menu')return;

  for(const e of es){
    const lock=e===tg,l=e.x-e.bw/2,k=e.n/e.t.length;
    rr(l,e.y,e.bw,e.bh,8*K);ctx.fillStyle=e.fl>0?'rgba(255,255,255,.28)':'rgba(0,0,0,.62)';ctx.fill();
    ctx.strokeStyle=lock?C.yl:C.ac;ctx.lineWidth=(lock?3:1.5)*Math.max(.7,K);ctx.stroke();
    // hanzi memudar putih → oranye seiring huruf yang benar
    ctx.fillStyle=`rgb(255,${Math.round(255-105*k)},${Math.round(255-225*k)})`;
    ctx.font=`700 ${e.fs}px ${HZ}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e.z,e.x,e.y+e.bh/2+2*K);
    ctx.fillStyle=C.ac;ctx.font=`800 ${e.pf}px Manrope,sans-serif`;ctx.textBaseline='top';
    ctx.fillText(e.t.slice(0,e.n),e.x,e.y+e.bh+5*K);                // huruf yang sudah benar
    if(lock){
      const[sx,sy]=shipXY();ctx.strokeStyle='rgba(40,230,230,.35)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(sx,sy-22*shipK());ctx.lineTo(e.x,e.y+e.bh);ctx.stroke();
    }
  }
  for(const b of bs){ctx.fillStyle='#fff0a0';ctx.beginPath();ctx.arc(b.x,b.y,3.5,0,6.3);ctx.fill()}
  for(const p of ps){ctx.globalAlpha=Math.min(1,p.l*2);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.3);ctx.fill()}
  ctx.globalAlpha=1;

  // pinyin + arti setelah kata hancur
  for(const q of pops){
    const y=q.y-(1.8-q.l)*30;
    ctx.globalAlpha=Math.min(1,q.l*1.2);ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.fillStyle=C.fg;ctx.font=`700 ${Math.max(14,18*K)}px Manrope,sans-serif`;ctx.fillText(q.p,q.x,y);
    if(q.a){ctx.fillStyle=C.cy;ctx.font=`600 ${Math.max(11,14*K)}px Manrope,sans-serif`;ctx.fillText(q.a,q.x,y+Math.max(15,20*K))}
  }
  ctx.globalAlpha=1;
  drawShip();

  // HUD
  const wpm=time>3?ok/5/(time/60):0,acc=ok+bad?100*ok/(ok+bad):100;
  ctx.textAlign='left';ctx.textBaseline='top';ctx.fillStyle=C.fg;ctx.font='700 15px Manrope,sans-serif';
  ctx.fillText(`Skor ${score}   Level ${level}   Combo ${combo}`,12,10);
  ctx.fillStyle=C.mut;ctx.font='600 12.5px Manrope,sans-serif';
  ctx.fillText(`WPM ${wpm.toFixed(0)} · Akurasi ${acc.toFixed(0)}% · ${deckName}`,12,32);
  // nyawa: heksagon kuning
  const hx=W-30,hy=H-30;ctx.fillStyle='#fac814';ctx.beginPath();
  for(let i=0;i<6;i++){const a=(60*i+30)*Math.PI/180;ctx.lineTo(hx+17*Math.cos(a),hy+17*Math.sin(a))}
  ctx.closePath();ctx.fill();ctx.fillStyle='#141414';ctx.font='800 16px Manrope,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lives,hx,hy+1);

  if(touch&&!paused&&document.activeElement!==kb){
    ctx.fillStyle='rgba(8,18,21,.75)';ctx.fillRect(0,H/2-26,W,52);
    ctx.fillStyle=C.yl;ctx.font='700 16px Manrope,sans-serif';ctx.textAlign='center';ctx.fillText('Ketuk layar untuk membuka keyboard',W/2,H/2);
  }
  if(paused){
    ctx.fillStyle='rgba(8,18,21,.72)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle=C.cy;ctx.font='900 56px "Noto Sans SC",Manrope,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('PAUSE',W/2,H/2-10);
    ctx.fillStyle=C.mut;ctx.font='600 14px Manrope,sans-serif';ctx.fillText(touch?'Ketuk ‖ untuk lanjut':'Tekan Enter untuk lanjut',W/2,H/2+34);
  }
}

/* ================= INPUT & LOOP ================= */
const feed=str=>{if(st!=='play'||paused)return;for(const ch of str.toLowerCase())if(/^[a-z]$/.test(ch))key(ch)};
const togglePause=()=>{if(st==='play')paused=!paused;$('#zg-pause').textContent=paused?'▶':'‖';if(!paused&&st==='play')kb.focus({preventScroll:true})};
const release=()=>{tg=null};

// Komputer: keydown. HP Android: keydown berisi kode palsu, jadi huruf dibaca dari event "input" di bawah.
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&st!=='menu'){toMenu();return}
  if(st==='menu'&&e.key==='Enter'&&document.activeElement.tagName!=='BUTTON'&&!$('#start').disabled){start();return}
  if(st!=='play')return;
  if(e.key==='Enter'){e.preventDefault();togglePause();return}
  if(e.key==='Tab'){e.preventDefault();release();return}
  if(!paused&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[a-z]$/i.test(e.key)){e.preventDefault();feed(e.key)}   // preventDefault: event "input" tidak ikut terpicu, jadi tidak dobel
});
let prev='';
kb.addEventListener('input',e=>{
  const v=kb.value;
  if(v.length>prev.length)feed(v.slice(prev.length));            // hanya huruf baru (abaikan hapus/backspace)
  prev=v;
  if(!e.isComposing||v.length>24){kb.value='';prev=''}            // kosongkan terus supaya tidak menumpuk
});
kb.addEventListener('compositionend',()=>{kb.value='';prev=''});
cv.addEventListener('pointerdown',()=>{if(st==='play'&&!paused)kb.focus({preventScroll:true})});   // ketuk layar = buka keyboard lagi
$('#zg-pause').onclick=togglePause;$('#zg-free').onclick=release;$('#zg-menu-btn').onclick=()=>{if(st!=='menu')toMenu()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st==='play'){paused=true;$('#zg-pause').textContent='▶'}});
$('#start').onclick=start;$('#again').onclick=start;$('#toMenu').onclick=toMenu;

resize();
let last=performance.now();
function loop(t){
  requestAnimationFrame(loop);          // jadwalkan dulu, supaya satu error tidak mematikan game
  const dt=Math.min(.05,(t-last)/1000);last=t;
  try{update(dt);draw()}catch(e){console.error(e)}
}
requestAnimationFrame(loop);
if(document.fonts&&document.fonts.load){document.fonts.load('700 56px "Noto Sans SC"','你好');document.fonts.load('800 22px Manrope','abc')}
})();
</script>
